
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run smoke
      - run: npm run pack:tgz
      - run: gh release create "$GITHUB_REF_NAME" dist/dsh-chat-avatar.tgz --generate-notes || gh release upload "$GITHUB_REF_NAME" dist/dsh-chat-avatar.tgz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
