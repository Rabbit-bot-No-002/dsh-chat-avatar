# 打 tag 时构建并把预构建 tarball 挂到 GitHub Release。
#
# 为什么需要它：仓库里不含 lib/（构建产物），用户用 `dsh plugin add github:...` 安装时
# 需要本地跑一次构建（pnpm 的 allowBuilds 授权）。挂一个预构建 tarball 后，
# 插件市场/awesome 列表可以直接给用户「下载 tarball」这种免构建安装方式。
#
# 用法：git tag v0.1.0 && git push origin v0.1.0
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run smoke
      # 产出 dist/dsh-chat-avatar.tgz —— 文件名故意不带版本号：
      # awesome 列表推荐用 .../releases/latest/download/dsh-chat-avatar.tgz 这种链接，
      # 带版本号的文件名会在下次发版后 404。
      - run: npm run pack:tgz
      - run: gh release create "$GITHUB_REF_NAME" dist/dsh-chat-avatar.tgz --generate-notes || gh release upload "$GITHUB_REF_NAME" dist/dsh-chat-avatar.tgz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
